name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        cd kiem-thu-dang-nhap
        pyinstaller --noconfirm --onefile --windowed --name KiemThuDangNhap --collect-all selenium login_checker.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: KiemThuDangNhap-Windows
        path: kiem-thu-dang-nhap/dist/KiemThuDangNhap.exe
